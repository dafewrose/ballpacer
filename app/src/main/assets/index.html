<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>打卡管家</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  :root{
    --bg:#0b0d12; --card:#151a23; --card2:#1b2130;
    --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.14);
    --txt:#e9ecf1; --muted:#8b94a4; --faint:#5c6474;
    --accent:#ffb454; --ok:#3ddc97;
  }
  html,body{margin:0;padding:0;background:var(--bg);color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;overscroll-behavior:none}
  body{min-height:100vh;background:
    radial-gradient(680px 380px at 85% -12%, rgba(255,180,84,.13), transparent 62%),
    radial-gradient(620px 420px at -10% 8%, rgba(76,201,240,.10), transparent 60%),
    var(--bg);
    background-attachment:fixed}
  .wrap{padding:14px 16px 110px;max-width:640px;margin:0 auto}

  /* 顶部 */
  .hd{margin:8px 2px 18px}
  .hd-row{display:flex;align-items:center;justify-content:space-between}
  .hd-title{font-size:12px;letter-spacing:.24em;color:var(--muted);font-weight:600}
  .hd-date{font-size:30px;font-weight:700;letter-spacing:-.02em;margin-top:6px}
  .hd-date small{font-size:14px;font-weight:500;color:var(--muted);margin-left:8px;letter-spacing:0}
  .hd-ring{width:76px;height:76px;border-radius:50%;flex:0 0 auto;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:linear-gradient(150deg,rgba(255,180,84,.20),rgba(255,180,84,.04));
    border:1px solid rgba(255,180,84,.35);box-shadow:0 8px 26px -12px rgba(255,180,84,.8)}
  .hd-ring span{font-size:24px;font-weight:800;line-height:1;color:var(--accent)}
  .hd-ring i{font-style:normal;font-size:10px;color:var(--muted);margin-top:4px;letter-spacing:.08em}

  .seg{display:flex;gap:6px;margin-top:18px;background:rgba(255,255,255,.05);
    padding:4px;border-radius:14px;border:1px solid var(--line)}
  .seg button{flex:1;border:0;background:transparent;color:var(--muted);
    font-family:inherit;font-size:13px;font-weight:600;padding:9px 0;border-radius:11px;transition:.18s}
  .seg button.on{background:rgba(255,255,255,.1);color:var(--txt);box-shadow:0 2px 10px rgba(0,0,0,.3)}

  /* 分区标题 */
  .sec{font-size:11px;letter-spacing:.2em;color:var(--faint);font-weight:700;
    margin:22px 4px 10px;text-transform:uppercase}

  /* 卡片 */
  .card{position:relative;display:flex;align-items:center;gap:14px;
    background:linear-gradient(160deg,var(--card2),var(--card));
    border:1px solid var(--line);border-radius:20px;padding:16px 14px 16px 18px;
    margin-bottom:12px;overflow:hidden;transition:transform .12s ease,border-color .2s}
  .card:active{transform:scale(.988)}
  .card>i.accent{position:absolute;left:0;top:0;bottom:0;width:4px;border-radius:4px}
  .card-main{flex:1;min-width:0}
  .card-top{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .card-name{font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tag{font-size:10.5px;font-weight:700;padding:3px 7px;border-radius:7px;
    background:rgba(255,255,255,.07);color:var(--muted);flex:0 0 auto;letter-spacing:.02em}
  .bar{height:6px;border-radius:6px;background:rgba(255,255,255,.07);overflow:hidden}
  .bar>i{display:block;height:100%;border-radius:6px;transition:width .35s cubic-bezier(.2,.8,.2,1)}
  .card-meta{display:flex;justify-content:space-between;gap:8px;margin-top:8px;
    font-size:11.5px;color:var(--faint)}
  .card-meta b{color:var(--muted);font-weight:600}

  .check{flex:0 0 auto;width:48px;height:48px;border-radius:50%;border:1.5px solid var(--line2);
    background:rgba(255,255,255,.04);display:flex;align-items:center;justify-content:center;
    transition:.18s;padding:0}
  .check svg{width:22px;height:22px;stroke:var(--muted);stroke-width:2.6;fill:none;
    stroke-linecap:round;stroke-linejoin:round;transition:.18s}
  .check.done{border-color:transparent;background:linear-gradient(150deg,#4ee6a4,#2fbf7f);
    box-shadow:0 8px 20px -8px rgba(61,220,151,.9)}
  .check.done svg{stroke:#06281a;stroke-width:3}
  .check:active{transform:scale(.92)}

  .empty{text-align:center;padding:56px 20px;color:var(--faint);line-height:2}
  .empty b{display:block;font-size:15px;color:var(--muted);margin-bottom:6px}

  .fab{position:fixed;right:18px;bottom:24px;width:60px;height:60px;border-radius:22px;
    border:0;background:linear-gradient(150deg,#ffc76e,#f59f2d);color:#23180a;
    font-size:30px;font-weight:400;line-height:1;box-shadow:0 14px 30px -10px rgba(245,159,45,.9);
    display:flex;align-items:center;justify-content:center;transition:transform .12s}
  .fab:active{transform:scale(.93)}

  /* 弹层 */
  .sheet{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;
    align-items:flex-end;z-index:30;-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
  .sheet.open{display:flex}
  .sheet-inner{width:100%;max-height:90vh;overflow-y:auto;-webkit-overflow-scrolling:touch;
    background:linear-gradient(180deg,#141924,#10141c);
    border-radius:26px 26px 0 0;border-top:1px solid var(--line2);
    padding:10px 18px calc(28px + env(safe-area-inset-bottom));
    animation:up .26s cubic-bezier(.2,.9,.25,1)}
  @keyframes up{from{transform:translateY(40px);opacity:.5}to{transform:none;opacity:1}}
  .grab{width:40px;height:4px;border-radius:4px;background:rgba(255,255,255,.18);margin:4px auto 14px}

  .modal{position:fixed;inset:0;background:rgba(0,0,0,.66);display:none;
    align-items:center;justify-content:center;padding:24px;z-index:40;
    -webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
  .modal.open{display:flex}
  .modal-card{width:100%;max-width:400px;background:linear-gradient(170deg,#1a2030,#12161f);
    border:1px solid var(--line2);border-radius:22px;padding:22px;
    animation:pop .22s cubic-bezier(.2,.9,.25,1)}
  @keyframes pop{from{transform:scale(.94);opacity:0}to{transform:none;opacity:1}}
  .modal-title{font-size:17px;font-weight:700}
  .modal-sub{font-size:12px;color:var(--muted);margin:6px 0 14px}
  textarea,input[type=text],input[type=number],input[type=time]{width:100%;
    background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:14px;
    color:var(--txt);font-family:inherit;font-size:15px;padding:12px 14px;outline:none}
  textarea{min-height:96px;resize:none;line-height:1.6}
  textarea:focus,input:focus{border-color:rgba(255,180,84,.6)}
  .modal-actions{display:flex;gap:10px;margin-top:16px}
  .btn{flex:1;border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--txt);
    font-family:inherit;font-size:15px;font-weight:600;padding:13px;border-radius:14px;transition:.15s}
  .btn:active{transform:scale(.98)}
  .btn.primary{background:linear-gradient(150deg,#ffc76e,#f59f2d);color:#23180a;border-color:transparent;
    box-shadow:0 10px 24px -10px rgba(245,159,45,.9)}
  .btn.danger{background:rgba(255,90,90,.14);border-color:rgba(255,90,90,.4);color:#ff9b9b}
  .btn.ghost{background:transparent;color:var(--muted)}

  /* 详情 */
  .d-hd{display:flex;align-items:flex-start;gap:12px;margin-bottom:6px}
  .d-name{font-size:22px;font-weight:800;flex:1;line-height:1.3}
  .d-sub{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.7}
  .d-big{font-size:44px;font-weight:800;letter-spacing:-.03em;line-height:1.1;margin:14px 0 2px}
  .d-big small{font-size:15px;color:var(--muted);font-weight:600;letter-spacing:0}

  .cal{margin-top:18px;background:rgba(255,255,255,.03);border:1px solid var(--line);
    border-radius:18px;padding:12px 10px}
  .cal-hd{display:flex;align-items:center;justify-content:space-between;
    font-size:13px;font-weight:700;color:var(--muted);margin-bottom:10px;padding:0 4px}
  .cal-nav{width:30px;height:30px;border-radius:10px;border:1px solid var(--line);
    background:rgba(255,255,255,.05);color:var(--txt);font-size:16px;line-height:1;padding:0}
  .cal-wk,.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
  .cal-wk div{font-size:10.5px;color:var(--faint);padding:4px 0}
  .cal-cell{position:relative;height:38px;border-radius:11px;font-size:13px;
    display:flex;align-items:center;justify-content:center;color:var(--muted)}
  .cal-cell.empty{background:transparent}
  .cal-cell.has{color:var(--txt);background:rgba(61,220,151,.14);font-weight:700}
  .cal-cell.has i{position:absolute;bottom:5px;width:4px;height:4px;border-radius:50%;background:var(--ok)}
  .cal-cell.today{box-shadow:inset 0 0 0 1.5px rgba(255,180,84,.75)}
  .cal-cell.sel{background:rgba(255,180,84,.22);color:var(--accent);font-weight:800}

  .rec{display:flex;gap:12px;padding:13px 2px;border-bottom:1px solid rgba(255,255,255,.05)}
  .rec:last-child{border-bottom:0}
  .rec-date{font-size:12.5px;color:var(--muted);flex:0 0 62px;font-weight:600;padding-top:1px}
  .rec-note{flex:1;font-size:13.5px;line-height:1.65;color:#c9d1de;word-break:break-word}
  .rec-note.none{color:var(--faint);font-style:italic}
  .rec-del{border:0;background:transparent;color:var(--faint);font-size:15px;padding:0 4px}

  .row{display:flex;gap:10px;margin-top:14px}

  /* 表单 */
  .fld{margin-top:16px}
  .fld>label{display:block;font-size:12px;color:var(--muted);margin-bottom:8px;font-weight:600;letter-spacing:.03em}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{padding:10px 14px;border-radius:12px;border:1px solid var(--line);
    background:rgba(255,255,255,.04);color:var(--muted);font-size:13px;font-family:inherit;font-weight:600}
  .chip.on{background:rgba(255,180,84,.18);border-color:rgba(255,180,84,.55);color:var(--accent)}
  .swatch{width:38px;height:38px;border-radius:12px;border:2px solid transparent}
  .swatch.on{border-color:#fff}
  .hintline{font-size:11.5px;color:var(--faint);line-height:1.7;margin-top:8px}
</style>
</head>
<body>

<div class="wrap">
  <header class="hd">
    <div class="hd-row">
      <div>
        <div class="hd-title">打卡管家</div>
        <div class="hd-date" id="todayLabel">—</div>
      </div>
      <div class="hd-ring"><span id="ringNum">0</span><i>项待办</i></div>
    </div>
    <div class="seg" id="filters">
      <button data-f="all" class="on">全部</button>
      <button data-f="cycle">周期</button>
      <button data-f="count">数量</button>
    </div>
  </header>
  <main id="list"></main>
</div>

<button class="fab" id="fab">＋</button>

<div class="sheet" id="sheet">
  <div class="sheet-inner"><div class="grab"></div><div id="detailBody"></div></div>
</div>

<div class="sheet" id="editor">
  <div class="sheet-inner"><div class="grab"></div><div id="editorBody"></div></div>
</div>

<div class="modal" id="noteModal">
  <div class="modal-card">
    <div class="modal-title">这次怎么样？</div>
    <div class="modal-sub" id="noteSub"></div>
    <textarea id="noteInput" placeholder="记一句，比如：手感不错，练了 40 分钟"></textarea>
    <div class="modal-actions">
      <button class="btn ghost" id="noteSkip">跳过</button>
      <button class="btn primary" id="noteSave">保存留言</button>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';

  var api = window.AndroidApi || null;
  var state = { habits: [], records: [], today: '' };
  var filter = 'all';
  var editing = null;
  var detailId = 0;
  var calY = 0, calM = 0, selDay = '';
  var noteRec = '';
  var COLORS = ['#FFB454', '#4CC9F0', '#3DDC97', '#FF7A8A', '#B98CFF', '#FFD166'];

  /* ---------- 小工具 ---------- */
  function $(id) { return document.getElementById(id); }
  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  function ymd(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function parseYmd(s) {
    var p = (s || '').split('-');
    return new Date(parseInt(p[0], 10), parseInt(p[1], 10) - 1, parseInt(p[2], 10));
  }
  function zhDate(s) {
    var d = parseYmd(s);
    var wk = ['日', '一', '二', '三', '四', '五', '六'];
    return (d.getMonth() + 1) + ' 月 ' + d.getDate() + ' 日<small>周' + wk[d.getDay()] + '</small>';
  }
  function toast(msg) {
    if (api && api.toast) { api.toast(msg); } else { window.alert(msg); }
  }
  function habitById(id) {
    for (var i = 0; i < state.habits.length; i++) {
      if (state.habits[i].id === Number(id) || String(state.habits[i].id) === String(id)) {
        return state.habits[i];
      }
    }
    return null;
  }
  function recordById(id) {
    for (var i = 0; i < state.records.length; i++) {
      if (String(state.records[i].id) === String(id)) { return state.records[i]; }
    }
    return null;
  }
  function recsOf(hid) {
    return state.records.filter(function (r) { return String(r.habitId) === String(hid); });
  }
  function recOn(hid, date) {
    for (var i = 0; i < state.records.length; i++) {
      var r = state.records[i];
      if (String(r.habitId) === String(hid) && r.date === date) { return r; }
    }
    return null;
  }
  function wdList(h) {
    return String(h.weekdays || '').split(',').filter(function (x) { return x; }).map(Number);
  }
  function mdList(h) {
    return String(h.monthdays || '').split(',').filter(function (x) { return x; }).map(Number);
  }
  function isDue(h, dateStr) {
    if (h.mode === 1) { return true; }
    var d = parseYmd(dateStr);
    var md = mdList(h);
    if (md.length) { return md.indexOf(d.getDate()) >= 0; }
    var wds = wdList(h);
    if (!wds.length) { return true; }
    var w = d.getDay() === 0 ? 7 : d.getDay();
    return wds.indexOf(w) >= 0;
  }
  function pendingToday(h) {
    if (recOn(h.id, state.today)) { return false; }
    if (h.mode === 1) { return recsOf(h.id).length < (h.total || 0); }
    return isDue(h, state.today);
  }
  function modeText(h) {
    if (h.mode === 1) { return '数量'; }
    return '周期';
  }
  function scheduleText(h) {
    var t = pad(h.remindHour || 0) + ':' + pad(h.remindMin || 0);
    var adv = Number(h.advance || 0);
    var tail = adv > 0 ? ' · 提前 ' + adv + ' 分弹提醒' : '';
    if (h.mode === 1) { return '每天 ' + t + ' 提醒' + tail; }
    var md = mdList(h);
    if (md.length) { return '每月 ' + md.join('、') + ' 号 · ' + t + tail; }
    var wds = wdList(h);
    if (!wds.length) { return '每天 · ' + t + tail; }
    var nm = ['', '一', '二', '三', '四', '五', '六', '日'];
    return '每周' + wds.map(function (w) { return nm[w]; }).join('、') + ' · ' + t + tail;
  }

  /* ---------- 数据 ---------- */
  function reload() {
    try {
      var raw = api && api.dump ? api.dump() : '{}';
      var d = JSON.parse(raw);
      state.habits = d.habits || [];
      state.records = d.records || [];
      state.today = d.today || ymd(new Date());
    } catch (e) {
      state = { habits: [], records: [], today: ymd(new Date()) };
    }
  }

  /* ---------- 首页 ---------- */
  function cardHtml(h) {
    var recs = recsOf(h.id);
    var done = !!recOn(h.id, state.today);
    var color = h.color || '#FFB454';
    var pct = 0, sub = '', right = '';
    if (h.mode === 1) {
      var total = h.total || 0;
      var left = Math.max(0, total - recs.length);
      pct = total ? Math.min(100, recs.length / total * 100) : 0;
      sub = '已打卡 ' + recs.length + ' 次';
      right = '剩 ' + left + ' 次';
    } else {
      var due = isDue(h, state.today);
      pct = done ? 100 : (due ? 0 : 100);
      sub = done ? '今天已完成' : (due ? '今天该打卡' : '今天休息');
      right = '累计 ' + recs.length + ' 次';
    }
    if (done) { pct = 100; }
    return ''
      + '<div class="card" data-id="' + h.id + '">'
      + '  <i class="accent" style="background:' + color + '"></i>'
      + '  <div class="card-main">'
      + '    <div class="card-top"><span class="card-name">' + esc(h.name) + '</span>'
      + '      <span class="tag">' + modeText(h) + '</span></div>'
      + '    <div class="bar"><i style="width:' + pct + '%;background:' + color + '"></i></div>'
      + '    <div class="card-meta"><span>' + esc(scheduleText(h)) + '</span><b>' + sub + ' · ' + right + '</b></div>'
      + '  </div>'
      + '  <button class="check' + (done ? ' done' : '') + '" data-id="' + h.id + '">'
      + '    <svg viewBox="0 0 24 24"><path d="M4 12.5l5 5 11-11"/></svg>'
      + '  </button>'
      + '</div>';
  }
  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function render() {
    $('todayLabel').innerHTML = zhDate(state.today);
    var pend = state.habits.filter(pendingToday).length;
    $('ringNum').textContent = pad(pend);

    var list = state.habits.filter(function (h) {
      if (filter === 'cycle') { return h.mode !== 1; }
      if (filter === 'count') { return h.mode === 1; }
      return true;
    });
    if (!list.length) {
      $('list').innerHTML = '<div class="empty"><b>还没有打卡事项</b>点右下角的 ＋ 新建一个<br>'
        + '可以建「流程性的事」也可以建「30 次课程包」</div>';
      return;
    }
    var cyc = list.filter(function (h) { return h.mode !== 1; });
    var cnt = list.filter(function (h) { return h.mode === 1; });
    var html = '';
    if (cyc.length) {
      html += '<div class="sec">周期打卡 · ' + cyc.length + '</div>' + cyc.map(cardHtml).join('');
    }
    if (cnt.length) {
      html += '<div class="sec">数量打卡 · ' + cnt.length + '</div>' + cnt.map(cardHtml).join('');
    }
    $('list').innerHTML = html;
  }

  /* ---------- 打卡 ---------- */
  function doCheck(id) {
    var h = habitById(id);
    if (!h) { return; }
    if (recOn(id, state.today)) {
      toast('今天已经打过卡了，可以在详情里撤回');
      return;
    }
    if (h.mode === 1 && recsOf(id).length >= (h.total || 0)) {
      toast('这个课程包已经打满了');
      return;
    }
    var rid = api && api.checkIn ? api.checkIn(String(id), state.today, '') : '0';
    reload();
    render();
    if (rid && String(rid) !== '0') { showNote(rid, id); }
  }

  function showNote(rid, hid) {
    noteRec = String(rid);
    var h = habitById(hid);
    $('noteSub').textContent = (h ? h.name : '') + ' · ' + state.today;
    var r = recordById(rid);
    $('noteInput').value = r && r.note ? r.note : '';
    $('noteModal').classList.add('open');
    syncBack();
    try { $('noteInput').focus(); } catch (e) {}
  }
  function closeNote() {
    $('noteModal').classList.remove('open');
    $('noteInput').blur();
    syncBack();
  }
  $('noteSkip').addEventListener('click', function () { closeNote(); });
  $('noteSave').addEventListener('click', function () {
    var v = $('noteInput').value.trim();
    if (v && api && api.setNote) { api.setNote(noteRec, v); }
    reload(); render(); closeNote();
    if (detailId) { renderDetail(); }
    toast('已记录');
  });

  /* ---------- 详情 ---------- */
  function openDetail(id) {
    detailId = Number(id);
    var d = parseYmd(state.today);
    calY = d.getFullYear();
    calM = d.getMonth();
    selDay = '';
    renderDetail();
    $('sheet').classList.add('open');
    syncBack();
  }
  function closeDetail() {
    $('sheet').classList.remove('open');
    detailId = 0;
    syncBack();
  }

  function renderDetail() {
    var h = habitById(detailId);
    if (!h) { closeDetail(); return; }
    var recs = recsOf(h.id).slice().sort(function (a, b) { return a.date < b.date ? 1 : -1; });
    var done = !!recOn(h.id, state.today);
    var color = h.color || '#FFB454';
    var big, small;
    if (h.mode === 1) {
      big = recs.length + '<small> / ' + (h.total || 0) + ' 次</small>';
      small = '还剩 ' + Math.max(0, (h.total || 0) - recs.length) + ' 次，打完自动结束';
    } else {
      big = recs.length + '<small> 次累计</small>';
      small = isDue(h, state.today) ? (done ? '今天已完成' : '今天该打卡') : '今天休息';
    }

    var html = ''
      + '<div class="d-hd"><div class="d-name">' + esc(h.name) + '</div>'
      + '  <button class="check' + (done ? ' done' : '') + '" id="dCheck" style="width:44px;height:44px">'
      + '    <svg viewBox="0 0 24 24"><path d="M4 12.5l5 5 11-11"/></svg></button></div>'
      + '<div class="d-sub">' + modeText(h) + ' · ' + esc(scheduleText(h)) + ' · ' + small + '</div>'
      + '<div class="d-big" style="color:' + color + '">' + big + '</div>'
      + '<div class="bar" style="height:8px"><i style="width:' + progressPct(h, recs) + '%;background:' + color + '"></i></div>'
      + renderCalendar(h)
      + '<div class="sec" style="margin:20px 2px 6px">'
      + (selDay ? (selDay + ' 的记录') : '全部记录 · ' + recs.length) + '</div>'
      + '<div id="recList">' + recordsHtml(recs) + '</div>'
      + '<div class="row"><button class="btn danger" id="dUndo">撤回最近一次</button></div>'
      + '<div class="row"><button class="btn ghost" id="dEdit">编辑</button>'
      + '<button class="btn danger" id="dDelete">删除这个打卡</button></div>';

    $('detailBody').innerHTML = html;

    $('dCheck').addEventListener('click', function () {
      if (recOn(h.id, state.today)) { toast('今天已经打过卡了'); return; }
      var rid = api && api.checkIn ? api.checkIn(String(h.id), state.today, '') : '0';
      reload(); render(); renderDetail();
      if (rid && String(rid) !== '0') { showNote(rid, h.id); }
    });
    $('dUndo').addEventListener('click', function () {
      var list = recsOf(h.id).slice().sort(function (a, b) { return a.date < b.date ? 1 : -1; });
      if (!list.length) { toast('还没有记录'); return; }
      if (!window.confirm('撤回 ' + list[0].date + ' 这次打卡？')) { return; }
      if (api && api.deleteRecord) { api.deleteRecord(String(list[0].id)); }
      reload(); render(); renderDetail();
      toast('已撤回');
    });
    $('dEdit').addEventListener('click', function () { closeDetail(); openEditor(h.id); });
    $('dDelete').addEventListener('click', function () {
      if (!window.confirm('删除「' + h.name + '」？所有记录一起删除，不能恢复。')) { return; }
      if (api && api.deleteHabit) { api.deleteHabit(String(h.id)); }
      reload(); render(); closeDetail();
      toast('已删除');
    });

    Array.prototype.forEach.call($('detailBody').querySelectorAll('.cal-cell.has,.cal-cell.today'), function (cell) {
      cell.addEventListener('click', function () {
        var ds = cell.getAttribute('data-d');
        if (!ds) { return; }
        selDay = (selDay === ds) ? '' : ds;
        renderDetail();
      });
    });
    Array.prototype.forEach.call($('detailBody').querySelectorAll('.cal-nav'), function (btn) {
      btn.addEventListener('click', function () {
        calM += Number(btn.getAttribute('data-nav'));
        if (calM < 0) { calM = 11; calY -= 1; }
        if (calM > 11) { calM = 0; calY += 1; }
        renderDetail();
      });
    });
    Array.prototype.forEach.call($('detailBody').querySelectorAll('.rec-del'), function (btn) {
      btn.addEventListener('click', function () {
        var rid = btn.getAttribute('data-rid');
        if (!window.confirm('删掉这条记录？')) { return; }
        if (api && api.deleteRecord) { api.deleteRecord(String(rid)); }
        reload(); render(); renderDetail();
      });
    });
  }

  function progressPct(h, recs) {
    if (h.mode === 1) {
      var t = h.total || 0;
      return t ? Math.min(100, recs.length / t * 100) : 0;
    }
    var d = parseYmd(state.today);
    var cnt = recs.filter(function (r) {
      var rd = parseYmd(r.date);
      return rd.getFullYear() === d.getFullYear() && rd.getMonth() === d.getMonth();
    }).length;
    return Math.min(100, cnt / 20 * 100);
  }

  function recordsHtml(recs) {
    if (selDay) {
      recs = recs.filter(function (r) { return r.date === selDay; });
    }
    if (!recs.length) {
      return '<div class="empty" style="padding:26px 0">这段时间还没有记录</div>';
    }
    return recs.map(function (r) {
      return '<div class="rec">'
        + '<div class="rec-date">' + (r.date || '').slice(5) + '</div>'
        + '<div class="rec-note' + (r.note ? '' : ' none') + '">' + (r.note ? esc(r.note) : '没有留言') + '</div>'
        + '<button class="rec-del" data-rid="' + r.id + '">✕</button>'
        + '</div>';
    }).join('');
  }

  function renderCalendar(h) {
    var first = new Date(calY, calM, 1);
    var startWd = (first.getDay() + 6) % 7;
    var days = new Date(calY, calM + 1, 0).getDate();
    var cells = '';
    for (var i = 0; i < startWd; i++) { cells += '<div class="cal-cell empty"></div>'; }
    for (var d = 1; d <= days; d++) {
      var ds = calY + '-' + pad(calM + 1) + '-' + pad(d);
      var rec = recOn(h.id, ds);
      var cls = 'cal-cell';
      if (rec) { cls += ' has'; }
      if (ds === state.today) { cls += ' today'; }
      if (ds === selDay) { cls += ' sel'; }
      cells += '<div class="' + cls + '" data-d="' + ds + '">' + d + (rec ? '<i></i>' : '') + '</div>';
    }
    return '<div class="cal">'
      + '<div class="cal-hd"><button class="cal-nav" data-nav="-1">‹</button>'
      + '<span>' + calY + ' 年 ' + (calM + 1) + ' 月</span>'
      + '<button class="cal-nav" data-nav="1">›</button></div>'
      + '<div class="cal-wk"><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div><div>日</div></div>'
      + '<div class="cal-grid">' + cells + '</div></div>';
  }

  /* ---------- 新建 / 编辑 ---------- */
  var editMode = 0, editWeekdays = [], editColor = COLORS[0], editAdvance = 10;

  function openEditor(id) {
    editing = id ? habitById(id) : null;
    editMode = editing ? (editing.mode || 0) : 0;
    editWeekdays = editing ? wdList(editing) : [];
    editColor = editing && editing.color ? editing.color : COLORS[0];
    editAdvance = editing ? Number(editing.advance == null ? 10 : editing.advance) : 10;
    renderEditor();
    $('editor').classList.add('open');
    syncBack();
  }
  function closeEditor() {
    $('editor').classList.remove('open');
    editing = null;
    syncBack();
  }

  function renderEditor() {
    var h = editing || {};
    var html = ''
      + '<div class="d-name" style="font-size:19px">' + (editing ? '编辑打卡' : '新建打卡') + '</div>'
      + '<div class="fld"><label>叫什么</label>'
      + '<input type="text" id="fName" value="' + esc(h.name || '') + '" placeholder="比如：篮球课 / 练琴 30 分钟"></div>'

      + '<div class="fld"><label>哪种打卡</label><div class="chips" id="fMode">'
      + '<button class="chip' + (editMode === 0 ? ' on' : '') + '" data-mode="0">周期打卡</button>'
      + '<button class="chip' + (editMode === 1 ? ' on' : '') + '" data-mode="1">数量打卡</button></div>'
      + '<div class="hintline" id="modeHint"></div></div>'

      + '<div id="cycleBox">'
      + '<div class="fld"><label>每周哪几天（不选＝每天）</label><div class="chips" id="fWeek">'
      + [1, 2, 3, 4, 5, 6, 7].map(function (w) {
        var nm = ['一', '二', '三', '四', '五', '六', '日'][w - 1];
        var on = editWeekdays.indexOf(w) >= 0 ? ' on' : '';
        return '<button class="chip' + on + '" data-wd="' + w + '">周' + nm + '</button>';
      }).join('')
      + '</div></div>'
      + '<div class="fld"><label>或者按「每月几号」（填了就会忽略上面的星期）</label>'
      + '<input type="text" id="fMonth" value="' + esc(h.monthdays || '') + '" placeholder="比如 1,15 表示每月 1 号和 15 号"></div>'
      + '</div>'

      + '<div id="countBox" style="display:none">'
      + '<div class="fld"><label>总共多少次</label>'
      + '<input type="number" id="fTotal" value="' + (h.total || 30) + '" min="1" max="999"></div>'
      + '<div class="hintline">数量打卡每天提醒你一次，<b>只有完成打卡才会推进</b>；'
      + '打满次数后这张卡片和通知会自动消失。</div>'
      + '</div>'

      + '<div class="fld"><label>每天几点提醒</label>'
      + '<input type="time" id="fTime" value="' + pad(h.remindHour == null ? 18 : h.remindHour) + ':' + pad(h.remindMin == null ? 30 : h.remindMin) + '"></div>'

      + '<div class="fld"><label>提前多久弹提醒</label><div class="chips" id="fAdv">'
      + [0, 5, 10, 15, 30, 60].map(function (m) {
        var on = editAdvance === m ? ' on' : '';
        return '<button class="chip' + on + '" data-adv="' + m + '">'
          + (m === 0 ? '不提前' : m + ' 分钟') + '</button>';
      }).join('')
      + '</div><div class="hintline">提前那次会以<b>横幅 + 声音</b>弹出来，到点还会再提醒一次；'
      + '已经打过卡就不会再打扰你。</div></div>'

      + '<div class="fld"><label>颜色</label><div class="chips" id="fColor">'
      + COLORS.map(function (c) {
        return '<button class="swatch' + (c === editColor ? ' on' : '') + '" data-c="' + c + '" style="background:' + c + '"></button>';
      }).join('')
      + '</div></div>'

      + '<div class="row"><button class="btn ghost" id="eCancel">取消</button>'
      + '<button class="btn primary" id="eSave">保存</button></div>';

    $('editorBody').innerHTML = html;

    function syncBox() {
      $('cycleBox').style.display = editMode === 1 ? 'none' : 'block';
      $('countBox').style.display = editMode === 1 ? 'block' : 'none';
      $('modeHint').textContent = editMode === 1
        ? '数量打卡：设一个总次数，每天提醒，完成一次少一次，满了自动结束。'
        : '周期打卡：按周一/周三这样循环，今天该做就会提醒你。';
      Array.prototype.forEach.call($('fMode').querySelectorAll('.chip'), function (b) {
        b.classList.toggle('on', Number(b.getAttribute('data-mode')) === editMode);
      });
    }
    syncBox();

    $('fMode').addEventListener('click', function (e) {
      var b = e.target.closest('[data-mode]');
      if (!b) { return; }
      editMode = Number(b.getAttribute('data-mode'));
      syncBox();
    });
    $('fWeek').addEventListener('click', function (e) {
      var b = e.target.closest('[data-wd]');
      if (!b) { return; }
      var w = Number(b.getAttribute('data-wd'));
      var i = editWeekdays.indexOf(w);
      if (i >= 0) { editWeekdays.splice(i, 1); } else { editWeekdays.push(w); }
      b.classList.toggle('on');
    });
    $('fColor').addEventListener('click', function (e) {
      var b = e.target.closest('[data-c]');
      if (!b) { return; }
      editColor = b.getAttribute('data-c');
      Array.prototype.forEach.call($('fColor').querySelectorAll('.swatch'), function (s) {
        s.classList.toggle('on', s.getAttribute('data-c') === editColor);
      });
    });
    $('fAdv').addEventListener('click', function (e) {
      var b = e.target.closest('[data-adv]');
      if (!b) { return; }
      editAdvance = Number(b.getAttribute('data-adv'));
      Array.prototype.forEach.call($('fAdv').querySelectorAll('.chip'), function (x) {
        x.classList.toggle('on', Number(x.getAttribute('data-adv')) === editAdvance);
      });
    });
    $('eCancel').addEventListener('click', closeEditor);
    $('eSave').addEventListener('click', saveHabit);
  }

  function saveHabit() {
    var name = ($('fName').value || '').trim();
    if (!name) { toast('先给它起个名字'); return; }
    var tv = ($('fTime').value || '18:30').split(':');
    var hh = parseInt(tv[0], 10);
    var mm = parseInt(tv[1], 10);
    if (isNaN(hh)) { hh = 18; }
    if (isNaN(mm)) { mm = 30; }

    var month = ($('fMonth').value || '').replace(/，/g, ',').replace(/\s/g, '');
    var obj = {
      id: editing ? editing.id : 0,
      name: name,
      mode: editMode,
      weekdays: editMode === 1 ? '' : editWeekdays.sort(function (a, b) { return a - b; }).join(','),
      monthdays: editMode === 1 ? '' : month,
      total: editMode === 1 ? Math.max(1, Math.min(999, parseInt($('fTotal').value, 10) || 30)) : 0,
      remindHour: hh,
      remindMin: mm,
      advance: editAdvance,
      color: editColor
    };
    if (api && api.saveHabit) {
      api.saveHabit(JSON.stringify(obj));
    }
    reload();
    render();
    closeEditor();
    toast('已保存');
  }

  /* ---------- 返回键 / 原生指令 ---------- */
  function syncBack() {
    var open = $('sheet').classList.contains('open')
      || $('editor').classList.contains('open')
      || $('noteModal').classList.contains('open');
    if (api && api.setCanBack) { api.setCanBack(open); }
  }

  window.__back = function () {
    if ($('noteModal').classList.contains('open')) { closeNote(); return; }
    if ($('editor').classList.contains('open')) { closeEditor(); return; }
    if ($('sheet').classList.contains('open')) { closeDetail(); return; }
  };

  window.__native = function (obj) {
    if (!obj) { return; }
    reload();
    render();
    if (obj.type === 'note' && obj.recordId) {
      showNote(obj.recordId, obj.habitId);
    } else if (obj.type === 'openHabit' && obj.habitId) {
      openDetail(obj.habitId);
    }
  };

  /* ---------- 事件 ---------- */
  $('filters').addEventListener('click', function (e) {
    var b = e.target.closest('[data-f]');
    if (!b) { return; }
    filter = b.getAttribute('data-f');
    Array.prototype.forEach.call($('filters').querySelectorAll('button'), function (x) {
      x.classList.toggle('on', x === b);
    });
    render();
  });

  $('list').addEventListener('click', function (e) {
    var btn = e.target.closest('.check');
    if (btn) { doCheck(btn.getAttribute('data-id')); return; }
    var card = e.target.closest('.card');
    if (card) { openDetail(card.getAttribute('data-id')); }
  });

  $('fab').addEventListener('click', function () { openEditor(0); });

  $('sheet').addEventListener('click', function (e) {
    if (e.target === $('sheet')) { closeDetail(); }
  });
  $('editor').addEventListener('click', function (e) {
    if (e.target === $('editor')) { closeEditor(); }
  });

  /* ---------- 启动 ---------- */
  reload();
  render();
  syncBack();
  try {
    var p = api && api.ready ? api.ready() : '';
    if (p) { window.__native(JSON.parse(p)); }
  } catch (e) { }
})();
</script>
</body>
</html>
